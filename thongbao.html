<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📢 Thông báo - Không gian văn hóa Hồ Chí Minh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  
  <!-- Moment.js for time formatting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/locale/vi.min.js"></script>

  <!-- Script bảo vệ trang bằng phân quyền -->
  <script src="auth_guard.js" data-card-id="thongbao"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="w-10 h-10 rounded-full hover:bg-indigo-500 flex items-center justify-center transition-colors">
          <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h1 class="text-xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-bullhorn text-yellow-300"></i> Thông Báo - Không gian văn hóa Hồ Chí Minh
        </h1>
      </div>
      <div id="admin-actions" class="hidden">
        <button onclick="openModal()" class="bg-white text-indigo-600 px-4 py-2 rounded-lg font-semibold hover:bg-indigo-50 transition-colors shadow-sm text-sm flex items-center gap-2">
          <i class="fa-solid fa-plus"></i> Đăng thông báo
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-4xl mx-auto px-4 py-8">
    <div id="loading" class="flex justify-center py-12">
      <div class="animate-spin rounded-full h-10 w-10 border-4 border-indigo-200 border-t-indigo-600"></div>
    </div>

    <!-- Timeline of Announcements -->
    <div id="announcements-list" class="space-y-6 hidden">
      <!-- Generated by JS -->
    </div>
    
    <!-- Load More Button -->
    <div id="load-more-container" class="hidden flex justify-center mt-8 pb-8">
      <button id="btn-load-more" onclick="loadMore()" class="px-6 py-2.5 bg-white border border-gray-200 text-gray-700 font-semibold rounded-full shadow-sm hover:bg-gray-50 transition-colors flex items-center gap-2">
        <i class="fa-solid fa-rotate-right"></i> Tải thêm thông báo cũ
      </button>
    </div>
    
    <!-- Empty state -->
    <div id="empty-state" class="hidden flex flex-col items-center justify-center py-16 text-gray-400">
      <i class="fa-regular fa-bell-slash text-6xl mb-4 text-gray-300"></i>
      <p class="text-lg">Chưa có thông báo nào được đăng.</p>
    </div>
  </main>

  <!-- Add Announcement Modal -->
  <div id="modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] hidden items-center justify-center p-4 transition-opacity opacity-0">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-lg transform scale-95 transition-transform" id="modal-content">
      <div class="p-6 border-b border-gray-100 flex justify-between items-center">
        <h3 class="text-xl font-bold text-gray-800" id="modal-title">Tạo thông báo mới</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Tiêu đề <span class="text-red-500">*</span></label>
          <input type="text" id="tb-title" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all" placeholder="Nhập tiêu đề thông báo...">
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Nội dung <span class="text-red-500">*</span></label>
          <textarea id="tb-content" rows="6" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all resize-none" placeholder="Nhập nội dung chi tiết..."></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold text-gray-700 mb-1">Mức độ ưu tiên</label>
          <select id="tb-priority" class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition-all">
            <option value="normal">Bình thường</option>
            <option value="high">Quan trọng (Đỏ)</option>
            <option value="success">Tin vui (Xanh lá)</option>
          </select>
        </div>
        <div class="flex items-center gap-2 mt-2">
          <input type="checkbox" id="tb-pinned" class="w-4 h-4 text-indigo-600 border-gray-300 rounded focus:ring-indigo-500 cursor-pointer">
          <label for="tb-pinned" class="text-sm font-medium text-gray-700 cursor-pointer flex items-center gap-1">
            <i class="fa-solid fa-thumbtack text-red-500"></i> Ghim thông báo này lên đầu
          </label>
        </div>
      </div>
      <div class="p-6 border-t border-gray-100 flex justify-end gap-3 bg-gray-50 rounded-b-2xl">
        <button onclick="closeModal()" class="px-5 py-2.5 text-gray-600 font-medium hover:bg-gray-200 rounded-xl transition-colors">Hủy</button>
        <button onclick="saveAnnouncement()" id="btn-save" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-medium rounded-xl transition-colors shadow-md flex items-center gap-2">
          <i class="fa-solid fa-paper-plane"></i> Đăng tải
        </button>
      </div>
    </div>
  </div>

  <script>
    // Firebase Config (User provided)
    const firebaseConfig = {
      apiKey: "AIzaSyBVueYYokJdqm_uCMqBL24d6YCtMTamCM8",
      authDomain: "csdlsongminh.firebaseapp.com",
      databaseURL: "https://csdlsongminh-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "csdlsongminh",
      storageBucket: "csdlsongminh.firebasestorage.app",
      messagingSenderId: "319501136448",
      appId: "1:319501136448:web:1c2a9a1b5582d3a9f725a5",
      measurementId: "G-VPPH1RXD7H"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }

    const auth = firebase.auth();
    const db = firebase.firestore();
    const rtdb = firebase.database();
    
    let currentUserData = null;
    let isSuperAdmin = false;
    let editingId = null;
    let allNotices = {};

    // Thiết lập tiếng việt cho thư viện thời gian
    moment.locale('vi');

    // Kiểm tra quyền (Chỉ Admin mới có quyền Đăng/Sửa/Xóa thông báo)
    auth.onAuthStateChanged(async (user) => {
      if (user) {
        try {
          const doc = await db.collection('users').doc(user.uid).get();
          if (doc.exists) {
            currentUserData = doc.data();
            const email = (user.email || '').toLowerCase();
            if (currentUserData.role === 'admin' || email === 'songminh138@gmail.com') {
              isSuperAdmin = true;
              document.getElementById('admin-actions').classList.remove('hidden');
            }
          }
        } catch(e) { console.error(e); }
      }
    });

    // Lắng nghe dữ liệu thông báo từ Firebase Realtime Database
    const noticesRef = rtdb.ref('announcements');
    let currentLimit = 15;
    let noticesListener = null;

    function listenNotices() {
      if (noticesListener) noticesRef.off('value', noticesListener);
      
      noticesListener = noticesRef.orderByChild('timestamp').limitToLast(currentLimit).on('value', (snapshot) => {
        document.getElementById('loading').style.display = 'none';
        const listEl = document.getElementById('announcements-list');
        const emptyEl = document.getElementById('empty-state');
        const loadMoreContainer = document.getElementById('load-more-container');
        
        listEl.innerHTML = '';
        
        if (!snapshot.exists()) {
          emptyEl.classList.remove('hidden');
          listEl.classList.add('hidden');
          loadMoreContainer.classList.add('hidden');
          return;
        }
        
        emptyEl.classList.add('hidden');
        listEl.classList.remove('hidden');
        
        if (snapshot.numChildren() === currentLimit) {
          loadMoreContainer.classList.remove('hidden');
        } else {
          loadMoreContainer.classList.add('hidden');
        }
        
        // Chuyển object sang array, tách riêng bài ghim và bài thường
        let pinnedNotices = [];
        let normalNotices = [];
        allNotices = {};
        
        snapshot.forEach(child => {
          const data = child.val();
          allNotices[child.key] = data;
          const notice = { id: child.key, ...data };
          if (data.isPinned) pinnedNotices.push(notice);
          else normalNotices.push(notice);
        });
        
        // Sắp xếp bài ghim và bài thường theo thời gian mới nhất
        pinnedNotices.sort((a,b) => b.timestamp - a.timestamp);
        normalNotices.sort((a,b) => b.timestamp - a.timestamp);
        
        const notices = [...pinnedNotices, ...normalNotices];
        
        notices.forEach(notice => {
        const priorityColors = {
          'normal': 'border-l-indigo-500',
          'high': 'border-l-red-500 bg-red-50',
          'success': 'border-l-green-500 bg-green-50'
        };
        const iconColors = {
          'normal': 'text-indigo-500 bg-indigo-100',
          'high': 'text-red-500 bg-red-100',
          'success': 'text-green-500 bg-green-100'
        };
        
        const bColor = priorityColors[notice.priority] || priorityColors['normal'];
        const iColor = iconColors[notice.priority] || iconColors['normal'];
        const timeAgo = moment(notice.timestamp).fromNow();
        const dateStr = moment(notice.timestamp).format('DD/MM/YYYY HH:mm');
        
        let actionBtns = '';
        if (isSuperAdmin) {
          actionBtns = `
            <button onclick="editNotice('${notice.id}')" class="text-gray-400 hover:text-blue-500 p-2 rounded-full hover:bg-blue-50 transition-colors" title="Sửa thông báo"><i class="fa-solid fa-pen"></i></button>
            <button onclick="deleteNotice('${notice.id}')" class="text-gray-400 hover:text-red-500 p-2 rounded-full hover:bg-red-50 transition-colors" title="Xóa thông báo"><i class="fa-solid fa-trash-can"></i></button>
          `;
        }
        
        // Escape HTML để chống XSS và chuyển \n thành thẻ <br/>
        const escapeHtml = (text) => {
          const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
          return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        };
        
        // Tự động nhận diện Link
        const linkify = (text) => {
          const urlRegex = /(https?:\/\/[^\s]+)/g;
          return text.replace(urlRegex, function(url) {
            return `<a href="${url}" target="_blank" class="text-indigo-600 hover:text-indigo-800 hover:underline font-semibold break-all transition-colors" onclick="event.stopPropagation()">${url}</a>`;
          });
        };
        
        let formattedContent = escapeHtml(notice.content).replace(/\n/g, '<br/>');
        formattedContent = linkify(formattedContent);
        const formattedTitle = escapeHtml(notice.title);
        
        const pinBadge = notice.isPinned ? `<div class="absolute -top-3 -right-3 bg-red-500 text-white text-xs font-bold px-2 py-1 rounded-full shadow-md flex items-center gap-1 z-10 animate-bounce"><i class="fa-solid fa-thumbtack"></i> Đã ghim</div>` : '';
        const borderPinned = notice.isPinned ? 'border-2 border-red-200' : 'border border-gray-100';

        const html = `
          <div class="bg-white rounded-2xl shadow-sm ${borderPinned} border-l-4 ${bColor} p-5 hover:shadow-md transition-shadow relative group">
            ${pinBadge}
            <div class="absolute top-4 right-4 opacity-0 group-hover:opacity-100 transition-opacity flex gap-1 z-10">
              ${actionBtns}
            </div>
            <div class="flex items-start gap-4">
              <div class="w-12 h-12 rounded-full ${iColor} flex items-center justify-center flex-shrink-0 mt-1">
                <i class="fa-solid fa-bell text-xl"></i>
              </div>
              <div class="flex-1">
                <h2 class="text-lg font-bold text-gray-800 mb-1 pr-8">${formattedTitle}</h2>
                <div class="flex items-center gap-3 text-xs text-gray-500 mb-3 font-medium">
                  <span class="flex items-center gap-1"><i class="fa-regular fa-clock"></i> ${timeAgo} (${dateStr})</span>
                  <span>•</span>
                  <span class="flex items-center gap-1"><i class="fa-regular fa-user"></i> ${escapeHtml(notice.authorName || 'Ban Quản Trị')}</span>
                </div>
                <div class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap">${formattedContent}</div>
              </div>
            </div>
          </div>
        `;
        listEl.insertAdjacentHTML('beforeend', html);
      });
    }, (error) => {
      console.error('Firebase DB Error:', error);
      document.getElementById('loading').style.display = 'none';
      const emptyEl = document.getElementById('empty-state');
      emptyEl.classList.remove('hidden');
      emptyEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-5xl mb-3 text-red-400"></i><p class="text-red-500 font-medium text-center">Lỗi tải dữ liệu: ${error.message}<br><span class="text-sm text-gray-500 mt-2 block">Vui lòng kiểm tra lại Rules của Realtime Database.</span></p>`;
    });
    }

    listenNotices();

    function loadMore() {
      currentLimit += 15;
      const btn = document.getElementById('btn-load-more');
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tải...';
      listenNotices();
    }

    // Xử lý Modal Đăng thông báo
    const modal = document.getElementById('modal');
    const modalContent = document.getElementById('modal-content');
    
    function openModal(isEdit = false) {
      if (!isEdit) {
        editingId = null;
        document.getElementById('tb-title').value = '';
        document.getElementById('tb-content').value = '';
        document.getElementById('tb-priority').value = 'normal';
        document.getElementById('tb-pinned').checked = false;
      }
      document.getElementById('modal-title').innerText = isEdit ? 'Sửa thông báo' : 'Tạo thông báo mới';
      document.getElementById('btn-save').innerHTML = isEdit ? '<i class="fa-solid fa-floppy-disk"></i> Cập nhật' : '<i class="fa-solid fa-paper-plane"></i> Đăng tải';
      
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      setTimeout(() => {
        modal.classList.remove('opacity-0');
        modalContent.classList.remove('scale-95');
      }, 10);
    }
    
    function closeModal() {
      modal.classList.add('opacity-0');
      modalContent.classList.add('scale-95');
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        document.getElementById('tb-title').value = '';
        document.getElementById('tb-content').value = '';
        document.getElementById('tb-priority').value = 'normal';
        document.getElementById('tb-pinned').checked = false;
        editingId = null;
      }, 300);
    }

    function editNotice(id) {
      const notice = allNotices[id];
      if (!notice) return;
      editingId = id;
      document.getElementById('tb-title').value = notice.title || '';
      document.getElementById('tb-content').value = notice.content || '';
      document.getElementById('tb-priority').value = notice.priority || 'normal';
      document.getElementById('tb-pinned').checked = !!notice.isPinned;
      openModal(true);
    }

    // Lưu thông báo lên Firebase
    async function saveAnnouncement() {
      const title = document.getElementById('tb-title').value.trim();
      const content = document.getElementById('tb-content').value.trim();
      const priority = document.getElementById('tb-priority').value;
      const isPinned = document.getElementById('tb-pinned').checked;
      const btn = document.getElementById('btn-save');

      if (!title || !content) {
        alert('Vui lòng nhập đầy đủ tiêu đề và nội dung!');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang lưu...';

      try {
        if (editingId) {
          await noticesRef.child(editingId).update({
            title: title,
            content: content,
            priority: priority,
            isPinned: isPinned,
            updatedAt: firebase.database.ServerValue.TIMESTAMP
          });
        } else {
          await noticesRef.push({
            title: title,
            content: content,
            priority: priority,
            isPinned: isPinned,
            timestamp: firebase.database.ServerValue.TIMESTAMP,
            authorId: auth.currentUser ? auth.currentUser.uid : 'admin',
            authorName: currentUserData ? (currentUserData.name || 'Ban Quản Trị') : 'Ban Quản Trị'
          });
        }
        closeModal();
      } catch (error) {
        console.error(error);
        alert('Lỗi: ' + error.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = editingId ? '<i class="fa-solid fa-floppy-disk"></i> Cập nhật' : '<i class="fa-solid fa-paper-plane"></i> Đăng tải';
      }
    }

    // Xóa thông báo
    async function deleteNotice(id) {
      if (confirm('Bạn có chắc chắn muốn xóa thông báo này?')) {
        try {
          await noticesRef.child(id).remove();
        } catch (error) {
          alert('Lỗi khi xóa: ' + error.message);
        }
      }
    }
  </script>
</body>
</html>
